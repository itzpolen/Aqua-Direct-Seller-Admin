name: Deploy seller portal to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "seller-portal/**"
      - ".github/workflows/deploy-seller-portal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seller-portal-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: seller-portal/package-lock.json

      - name: Verify Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Configure the SUPABASE_URL Actions secret."; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Configure the SUPABASE_ANON_KEY Actions secret."; exit 1; }

      - name: Install dependencies
        run: npm ci --prefix seller-portal

      - name: Build seller portal
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build --prefix seller-portal -- --base=/Aqua-Direct-Seller-Admin/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: seller-portal/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
